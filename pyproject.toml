[project]
name = "ark-angel"
version = "0.1.0"
description = "Pattern recognition that surfaces leads in missing-person case evidence"
authors = [{ name = "Ark Angel Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
    "piexif>=1.1",
    "requests>=2.28",
]

[project.scripts]
"ark-angel" = "ark_angel.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ark_angel = ["demo_data/*", "geo/data/*"]
