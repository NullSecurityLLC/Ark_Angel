[project]
name = "ark-angel"
dynamic = ["version"]
description = "Pattern recognition that surfaces leads in missing-person case evidence"
authors = [{ name = "Ark Angel Team" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "Pillow>=12.3",
    "piexif>=1.1",
    "requests>=2.33",
    "urllib3>=2.8",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
web = [
    "Flask>=3.0",
    "waitress>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/NullSecurityLLC/Ark_Angel"
Releases = "https://github.com/NullSecurityLLC/Ark_Angel/releases"

[project.scripts]
"ark-angel" = "ark_angel.cli:cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "ark_angel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ark_angel = ["demo_data/*", "geo/data/*", "report/*.png", "web/templates/*", "web/templates/*/*", "web/static/*"]
