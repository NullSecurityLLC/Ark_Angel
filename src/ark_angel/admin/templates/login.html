{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<section class="login">
  <img src="{{ url_for('static', filename='favicon.png') }}" alt="" width="48" height="48">
  <div class="label">ArkAngel · admin</div>
  <h1>Sign in</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ login_csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
    <button type="submit">Sign in</button>
  </form>
  <p class="fine">No account? There's no sign-up here. Create one on this machine with <code>ark-angel admin create-user</code>.</p>
</section>
{% endblock %}
