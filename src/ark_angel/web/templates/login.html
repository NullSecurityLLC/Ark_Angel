{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<section class="narrow">
  <div class="label">Case teams</div>
  <h1>Sign in</h1>
  {% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('public.login') }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
    <button type="submit" class="btn primary">Sign in</button>
  </form>
  <p class="fine">No account? <a href="{{ url_for('public.signup') }}">Request access</a>. An administrator approves every account.</p>
</section>
{% endblock %}
